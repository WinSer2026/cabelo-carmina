<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dicas de Cuidados · Cabelo Carmina</title>
<meta name="description" content="Dicas para manter tranças, próteses e cabelo saudável — Cabelo Carmina, Malhampsene, Matola." />
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
<header>
  <div class="nav">
    <div class="brand">
      <svg class="logo" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="48" fill="none" stroke="#c9a24b" stroke-width="4"/><text x="50" y="62" text-anchor="middle" font-family="Segoe UI, Arial" font-size="38" font-weight="700" fill="#e3c87f">CL</text></svg>
      Cabelo <span>Carmina</span>
    </div>
    <nav>
      <a href="index.html">Início</a>
      <a href="index.html#catalogo">Catálogo</a>
      <a href="galeria.html">Galeria</a>
      <a href="dicas.html">Dicas</a>
      <a href="depoimentos.html">Depoimentos</a>
      <a href="sobre.html">Sobre</a>
    </nav>
    <div class="right">
      <button class="theme-btn" id="themeBtn" title="Modo escuro/claro">🌓</button>
      <a class="cta" href="index.html#agendar">Agendar agora</a>
    </div>
  </div>
</header>

<section class="hero" style="padding:80px 22px">
  <div class="badge">★ Cuidados</div>
  <h1>Dicas para o seu <span>cabelo</span></h1>
  <p>Pequenos hábitos que fazem grande diferença na duração e saúde do seu visual.</p>
</section>

<section>
  <div class="wrap">
    <div class="tips-list" id="tips"></div>
  </div>
</section>

<footer>
  © <span id="year"></span> Cabelo Carmina — Malhampsene, Matola - Maputo, Moçambique · <a href="index.html">Voltar ao site</a>
</footer>
<a class="fab" id="fab" href="#">💬</a>

<script src="assets/conteudo.js"></script>
<script>
  document.getElementById('year').textContent=new Date().getFullYear();
  document.getElementById('fab').href='https://wa.me/'+CONFIG.salon.whatsapp1;
  var t=JSON.parse('"'+localStorage.getItem('tema')+'"');   if(localStorage.getItem('tema')==='dark') document.documentElement.setAttribute('data-theme','dark');
  document.getElementById('themeBtn').addEventListener('click',function(){ var c=document.documentElement.getAttribute('data-theme'); if(c==='dark'){document.documentElement.removeAttribute('data-theme');localStorage.setItem('tema','light');}else{document.documentElement.setAttribute('data-theme','dark');localStorage.setItem('tema','dark');} });
  var box=document.getElementById('tips');
  CONFIG.dicas.forEach(function(d){ var el=document.createElement('div'); el.className='tip'; el.innerHTML='<h3>'+d.titulo+'</h3><p>'+d.texto+'</p>'; box.appendChild(el); });
</script>
</body>
</html>
