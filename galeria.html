<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Galeria · Cabelo Carmina | Matola - Maputo</title>
<meta name="description" content="Galeria de inspirações, tranças e vídeos do Cabelo Carmina em Matola - Maputo." />
<style>
  :root{
    --gold:#c9a24b;--gold-soft:#e3c87f;--dark:#1c1410;--dark2:#2a201a;
    --cream:#f7f1e8;--ink:#3a2f26;--muted:#7a6a5b;--radius:18px;--shadow:0 18px 40px rgba(28,20,16,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:"Segoe UI",Helvetica,Arial,sans-serif;color:var(--ink);background:var(--cream);line-height:1.6}
  h1,h2,h3{line-height:1.2;color:var(--dark)}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1200px;margin:0 auto;padding:0 22px}

  header{position:sticky;top:0;z-index:50;background:rgba(28,20,16,.92);backdrop-filter:blur(8px);color:#fff}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:12px 22px;max-width:1200px;margin:0 auto;gap:14px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.5px;font-size:1.15rem;color:#fff}
  .brand .logo{width:38px;height:38px}
  .brand span{color:var(--gold-soft)}
  .nav nav{display:flex;gap:18px;flex-wrap:wrap;font-size:.92rem}
  .nav nav a{color:#e9dccb}
  .nav nav a:hover{color:var(--gold-soft)}
  .nav a.cta{background:var(--gold);color:#1c1410;font-weight:700;padding:10px 16px;border-radius:999px;font-size:.9rem;white-space:nowrap}
  .nav a.cta:hover{background:var(--gold-soft)}

  .hero{position:relative;color:#fff;text-align:center;padding:84px 22px 76px;background:linear-gradient(180deg,rgba(28,20,16,.6),rgba(28,20,16,.85)),url("assets/imagens/21777facedbab7ad92beb284ebc9bb15.jpg") center/cover no-repeat}
  .hero h1{font-size:clamp(1.9rem,4.5vw,3rem);margin-bottom:10px}
  .hero h1 span{color:var(--gold-soft)}
  .hero p{max-width:600px;margin:0 auto;color:#f0e6d8}

  .filters{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:34px 0 8px}
  .filters button{border:1.5px solid var(--gold);background:transparent;color:var(--dark);font-weight:700;padding:9px 20px;border-radius:999px;cursor:pointer;font:inherit}
  .filters button.active{background:var(--gold);color:#1c1410}
  .filters button:hover{background:var(--gold-soft)}

  section{padding:30px 0 70px}
  .sec-title{text-align:center;margin:30px 0 22px}
  .sec-title .kicker{color:var(--gold);font-weight:700;letter-spacing:2px;text-transform:uppercase;font-size:.8rem}
  .sec-title h2{font-size:clamp(1.4rem,3vw,2rem);margin:6px 0}

  /* VIDEOS */
  .video-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
  .video-card{background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  .video-card video{width:100%;display:block;background:#000;aspect-ratio:9/16;object-fit:cover}
  .video-card .cap{padding:12px 16px;font-size:.9rem;color:var(--muted);font-weight:600}

  /* MASONRY */
  .masonry{column-count:auto;column-width:230px;column-gap:14px}
  .masonry a{display:block;margin-bottom:14px;break-inside:avoid;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);background:#ddd}
  .masonry img{width:100%;display:block;transition:transform .3s ease}
  .masonry a:hover img{transform:scale(1.05)}

  /* LIGHTBOX */
  .lightbox{position:fixed;inset:0;background:rgba(20,14,10,.94);display:none;align-items:center;justify-content:center;z-index:100;padding:24px}
  .lightbox.open{display:flex}
  .lightbox img{max-width:94vw;max-height:90vh;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .lightbox .close{position:absolute;top:18px;right:22px;color:#fff;font-size:2rem;cursor:pointer;background:none;border:none}
  .lightbox .nav-btn{position:absolute;top:50%;transform:translateY(-50%);color:#fff;font-size:2.4rem;cursor:pointer;background:none;border:none;padding:10px 16px;user-select:none}
  .lightbox .prev{left:8px}.lightbox .next{right:8px}

  footer{background:var(--dark);color:#cbbfae;text-align:center;padding:26px 22px;font-size:.88rem}
  @media(max-width:720px){.nav nav{display:none}}
</style>
</head>
<body>

<header>
  <div class="nav">
    <div class="brand">
      <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="48" fill="none" stroke="#c9a24b" stroke-width="4"/>
        <text x="50" y="62" text-anchor="middle" font-family="Segoe UI, Arial" font-size="38" font-weight="700" fill="#e3c87f">CL</text>
      </svg>
      Cabelo <span>Carmina</span>
    </div>
    <nav>
      <a href="index.html">Início</a>
      <a href="galeria.html">Galeria</a>
      <a href="pedido.html">Encomendar</a>
      <a href="index.html#agendar">Agendar</a>
    </nav>
    <a class="cta" href="index.html#agendar">Agendar agora</a>
  </div>
</header>

<section class="hero">
  <h1>Galeria de <span>Inspirações</span></h1>
  <p>Tranças, penteados e referências reais para o seu próximo visual. Toque numa imagem para ampliar.</p>
</section>

<section>
  <div class="wrap">
    <div class="filters">
      <button id="f-all" class="active" onclick="setFilter('all')">Tudo</button>
      <button id="f-img" onclick="setFilter('img')">Imagens</button>
      <button id="f-vid" onclick="setFilter('vid')">Vídeos</button>
    </div>

    <div id="videosBlock">
      <div class="sec-title"><div class="kicker">Em movimento</div><h2>Vídeos</h2></div>
      <div class="video-row" id="videoRow"></div>
    </div>

    <div id="imagesBlock">
      <div class="sec-title"><div class="kicker">Portfólio</div><h2>Imagens</h2></div>
      <div class="masonry" id="masonry"></div>
    </div>
  </div>
</section>

<div class="lightbox" id="lightbox">
  <button class="close" onclick="closeLB()">×</button>
  <button class="nav-btn prev" onclick="navLB(-1)">‹</button>
  <img id="lbImg" src="" alt="Inspiração" />
  <button class="nav-btn next" onclick="navLB(1)">›</button>
</div>

<footer>
  © <span id="year"></span> Cabelo Carmina — Matola - Maputo, Moçambique · <a href="index.html" style="color:var(--gold-soft)">Voltar ao site</a>
</footer>

<script src="assets/galeria.js"></script>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  var currentList = [];
  var currentIndex = 0;

  // render videos
  var vrow = document.getElementById('videoRow');
  GALERIA_VIDEOS.forEach(function(v,i){
    var card = document.createElement('div');
    card.className = 'video-card';
    card.innerHTML = '<video src="'+v+'" muted loop playsinline preload="metadata" onclick="this.paused?this.play():this.pause()"></video>'
      + '<div class="cap">Vídeo '+(i+1)+' · toque para reproduzir</div>';
    vrow.appendChild(card);
  });

  // render images
  var m = document.getElementById('masonry');
  GALERIA_IMAGENS.forEach(function(src){
    var a = document.createElement('a');
    a.href = '#';
    a.setAttribute('data-src', src);
    var im = document.createElement('img');
    im.src = src; im.loading = 'lazy'; im.alt = 'Inspiração Cabelo Carmina';
    a.appendChild(im);
    a.addEventListener('click', function(e){ e.preventDefault(); openLB(src); });
    m.appendChild(a);
  });

  function setFilter(f){
    document.getElementById('f-all').classList.toggle('active', f==='all');
    document.getElementById('f-img').classList.toggle('active', f==='img');
    document.getElementById('f-vid').classList.toggle('active', f==='vid');
    document.getElementById('imagesBlock').style.display = (f==='vid')?'none':'block';
    document.getElementById('videosBlock').style.display = (f==='img')?'none':'block';
  }

  function openLB(src){
    currentList = GALERIA_IMAGENS.slice();
    currentIndex = currentList.indexOf(src);
    if(currentIndex < 0) currentIndex = 0;
    document.getElementById('lbImg').src = src;
    document.getElementById('lightbox').classList.add('open');
  }
  function closeLB(){ document.getElementById('lightbox').classList.remove('open'); }
  function navLB(d){
    currentIndex = (currentIndex + d + currentList.length) % currentList.length;
    document.getElementById('lbImg').src = currentList[currentIndex];
  }
  document.getElementById('lightbox').addEventListener('click', function(e){
    if(e.target.id === 'lightbox') closeLB();
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') closeLB();
    if(e.key === 'ArrowLeft') navLB(-1);
    if(e.key === 'ArrowRight') navLB(1);
  });
</script>
</body>
</html>
